<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POO Js</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <main>
        <h1>Calculadora de IMC</h1>
        <form action='' method='post'>

            <div class="form-group">
                <label for="nome">Nome <span class="detalhes">*</span></label>
                <input 
                    type="text"
                    name="nome"
                    id="nome"
                    placeholder="Nome"
                    autofocus
                    required
                />
            </div>

            <div class="form-group">
                <label for="idade">Idade <span class="detalhes">*</span></label>
                <input 
                    type="number"
                    name="idade"
                    id="idade"
                    min="1" max="120" step="1"
                    placeholder="Idade"
                    required
                />
                <!-- 0.01 metros a 3 metros -->
            </div>

            <div class="form-group">
                <label for="peso">Peso <span class="detalhes">*</span></label>
                <input 
                    type="number"
                    name="peso"
                    id="peso"
                    min="1.0" max="600.0" step="0.1"
                    placeholder="Peso"
                    required
                />
                <!-- 1kg a 600kg -->
            </div>

            <div class="form-group">
                <label for="altura">Altura <span class="detalhes">*</span></label>
                <input
                    type="number"
                    name="altura"
                    id="altura"
                    min="0.05" max="3.0" step="0.01"
                    placeholder="Altura"
                    required
                />
                <!-- 0.05m a 3.0m -->
            </div>

            <div class="form-group">
                <button
                    type="submit"
                    id="btnCalcular"
                    class="btn"
                    name="btnCalcular"
                >
                    Calcular
                </button>
            </div>
        </form>

        <!-- view -->
        <div id="dados">
            <!--tabela-->
        </div>
    </main>
   
    <script type="module" src="js/main.js"></script>
</body>
</html>
